[package]
name = "quiklight"
version = "0.1.0"
edition = "2021"

[dependencies]
x11rb   = { version = "0.13", features = ["shm", "randr", "allow-unsafe-code"] }
anyhow  = "1"
serde   = { version = "1", features = ["derive"] }
toml    = "0.8"
libc    = "0.2"
dirs    = "5"
clap    = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto       = true
